[package]
name = "airllm-rs"
version = "0.1.0"
edition = "2021"
description = "Terminal chat UI for AirLLM with Obsidian memory graph"
license = "Apache-2.0"
default-run = "airllm"

[[bin]]
name = "airllm"
path = "src/main.rs"
[[bin]]
name = "test_reqwest"
path = "scratch/test_reqwest.rs"

[dependencies]
# TUI
ratatui = "0.29.0"
crossterm = { version = "0.28", features = ["event-stream"] }
tui-textarea = "0.7.0"

# HTTP / Async
reqwest = { version = "0.12", features = ["json", "stream"] }
reqwest-eventsource = "0.5"


# Async
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
color-eyre = "0.6"
dashmap = "6"
async-trait = "0.1"

# Config
toml = "0.8"

# Misc
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
textwrap = "0.16.2"
arboard = "3.6.1"

# Search
regex = "1"
walkdir = "2"
ignore = "0.4"

# Web Scraping
scraper = "0.20"

# Image / multimodal
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
tui-markdown = "0.3.7"
sysinfo = "0.39.5"
tiktoken-rs = "0.12.0"

# Epic architecture
git2 = "0.19"
petgraph = "0.6"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
pbkdf2 = "0.12"
similar = "2"
ropey = "1"
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"

